<!doctype html><meta charset="utf-8"><title>Jarvis - Privacidad</title>
<h1>Política de privacidad</h1>
<p>Jarvis es una herramienta personal usada únicamente por su propietario. Accede a su
correo y calendario solo para responder a sus peticiones. No comparte, vende ni
transfiere datos a terceros, y no recopila datos de otras personas.</p>
